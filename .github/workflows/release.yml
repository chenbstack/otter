name: release

# 推 v* 版本 tag 时构建三个平台的包并发布到 GitHub Release;也可手动触发(只构建、不发布)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    timeout-minutes: 40
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # 版本号以 tag 为准(v0.2.0 → 0.2.0),安装包文件名和应用内的版本比较都用它
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          perl -0pi -e "s/^version = \".*\"/version = \"$ver\"/m" Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-21
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/Otter-*.dmg

  windows:
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 版本号以 tag 为准(v0.2.0 → 0.2.0),安装包文件名和应用内的版本比较都用它
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          perl -0pi -e "s/^version = \".*\"/version = \"$ver\"/m" Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-21
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin otter-gui --bin otter
      # 安装程序是自己写的(src/bin/setup.rs),把上面构建好的两个 exe 编进去
      - name: Build installer
        shell: pwsh
        run: |
          cargo build --profile setup --bin otter-setup --features payload
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/setup/otter-setup.exe "dist/Otter-$ver-windows-x86_64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Otter-*-setup.exe

  linux:
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # 版本号以 tag 为准(v0.2.0 → 0.2.0),安装包文件名和应用内的版本比较都用它
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          perl -0pi -e "s/^version = \".*\"/version = \"$ver\"/m" Cargo.toml
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev \
            libssl-dev libdbus-1-dev libgbm-dev libdrm-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-21
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin otter-gui --bin otter
      - name: Package
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          dir="Otter-$ver-linux-x86_64"
          mkdir "$dir"
          cp target/release/otter-gui target/release/otter "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Otter-*.tar.gz

  publish:
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
