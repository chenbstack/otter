name: release

# 推 v* 版本 tag 时构建 macOS、Windows 的包(Linux 暂时不打包)并发布到 GitHub Release;也可手动触发(只构建、不发布)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 发布包不需要调试信息:去掉能少做一部分编译和链接的工作(本地 Cargo.toml 里的 debug = 1 不动,开发时回溯要用)
env:
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  macos:
    timeout-minutes: 40
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # 版本号以 tag 为准(v0.2.0 → 0.2.0),安装包文件名和应用内的版本比较都用它
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          perl -0pi -e "s/^version = \".*\"/version = \"$ver\"/m" Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-21
      # 缓存按 ref 隔离,tag 读不到别的 tag 的缓存,只能读 main 的:由 cache-warm.yml 在 main 上保存,发版只读
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/Otter-*.dmg

  windows:
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 版本号以 tag 为准(v0.2.0 → 0.2.0),安装包文件名和应用内的版本比较都用它
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          perl -0pi -e "s/^version = \".*\"/version = \"$ver\"/m" Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-21
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --bin otter-gui --bin otter
      # 安装程序是自己写的(src/bin/setup.rs),把上面构建好的两个 exe 编进去。
      # 必须用 release profile:自定义 profile 会另起 target/setup 目录,把所有依赖重编一遍(曾多花近 9 分钟)
      - name: Build installer
        shell: pwsh
        run: |
          cargo build --release --bin otter-setup --features payload
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/otter-setup.exe "dist/Otter-$ver-windows-x86_64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Otter-*-setup.exe

  publish:
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
