name: update-catalog

# 每天刷新一次应用商店目录里的内置版本列表(apps/catalog.json 的 fallback),有变化就提交到 main
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh catalog versions
        run: python3 scripts/update-catalog.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet apps/catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/catalog.json
            git commit -m "目录:刷新应用版本列表"
            git push
          fi
