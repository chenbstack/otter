[package]
name = "dockyard"
version = "0.1.0"
edition = "2024"
default-run = "dockyard"

[dependencies]
# 上游 0.3.0 的副本,为了给渲染层加关键字高亮钩子,改动见 docs/modules/terminal.md
gpui_xterm = { path = "vendor/gpui_xterm" }
regex = "1"
russh = "0.65"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
gpui-kit = "=0.9.1"
# 仅为用 Window::render_to_image 离屏截图:直接给底层 crate 开 test-support,靠特性统一生效
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui-macos = { package = "gpui-pre-macos", version = "=0.3.12", features = ["test-support"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
directories = "6.0.0"
keyring = "4.2.0"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
zeroize = "1.9.2"
russh-sftp = "4.0.0"

[profile.release]
debug = 1
