[package]
name = "otter"
version = "0.1.0"
edition = "2024"
default-run = "otter-gui"

[[bin]]
name = "otter-gui"
path = "src/main.rs"

[[bin]]
name = "otter"
path = "src/bin/otter.rs"

[[bin]]
name = "otter-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[features]
# 安装程序里编入 target/release 下已构建好的 otter-gui.exe / otter.exe(CI 先构建它们,再带此特性构建 otter-setup)
payload = []

[dependencies]
# 上游 0.3.0 的副本,为了给渲染层加关键字高亮钩子,改动见 docs/modules/terminal.md
gpui_xterm = { path = "vendor/gpui_xterm" }
regex = "1"
csv = "1.4"
russh = "0.65"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
gpui-kit = "=0.9.1"
# 仅为用 Window::render_to_image 离屏截图:直接给底层 crate 开 test-support,靠特性统一生效
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
directories = "6.0.0"
keyring = "4.2.0"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
zeroize = "1.9.2"
rand = "0.10"
russh-sftp = "4.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-macos = { package = "gpui-pre-macos", version = "=0.3.12", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
debug = 1
