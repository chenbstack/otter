[package]
name = "otter"
version = "0.7.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/chenbstack/otter"
default-run = "otter-gui"

[[bin]]
name = "otter-gui"
path = "src/main.rs"

[[bin]]
name = "otter"
path = "src/bin/otter.rs"

[[bin]]
name = "otter-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[features]
# 安装程序里编入 target/release 下已构建好的 otter-gui.exe / otter.exe(CI 先构建它们,再带此特性构建 otter-setup)
payload = []
# OrbStack 虚拟机真机测试(src/orbtest,只在 scripts/orbtest.sh 里带上);不开它,普通 cargo test 连编译都不编译这些用例
orbtest = []

[dependencies]
# 上游 0.3.0 的副本,为了给渲染层加关键字高亮钩子,改动见 docs/modules/terminal.md
gpui_xterm = { path = "vendor/gpui_xterm" }
regex = "1"
csv = "1.4"
russh = "0.65"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
gpui-kit = { version = "=0.9.1", features = ["tree-sitter-yaml", "tree-sitter-bash", "gpui-fast"] }
# 仅为用 Window::render_to_image 离屏截图:直接给底层 crate 开 test-support,靠特性统一生效
gpui = { package = "gpui-fast", version = "=0.1.14", features = ["test-support"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
directories = "6.0.0"
keyring = "4.2.0"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
zeroize = "1.9.2"
# 查本地接口对端进程的真实可执行路径(各平台通用)
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
rand = "0.10"
russh-sftp = "4.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(windows)'.dependencies]
# 命名管道对端进程号:GetNamedPipeClientProcessId
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry"] }
# 安装程序创建快捷方式(IShellLink)
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
# 安装程序直接读写注册表(PATH、卸载入口)
winreg = "0.56"

[build-dependencies]
flate2 = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
debug = 1

# 只给安装程序用:体积优先(CI 里 `cargo build --profile setup --bin otter-setup --features payload`)
[profile.setup]
inherits = "release"
debug = false

# 只有安装器自己的代码体积优先;依赖保持和 release 一样,这样 CI 里两次构建能共用编译结果
[profile.setup.package.otter]
opt-level = "s"
